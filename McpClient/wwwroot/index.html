<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Customer support agent</title>
  <style>
    body { font: 16px system-ui, sans-serif; max-width: 850px; margin: 40px auto; padding: 0 20px; color: #182433; background: #f6f8fb; }
    h1 { font-size: 1.8rem; }
    #messages { min-height: 240px; margin: 24px 0; }
    .message { padding: 16px; margin: 12px 0; border-radius: 8px; background: white; border: 1px solid #dbe2eb; }
    .message.user { background: #eaf2ff; }
    .message p { white-space: pre-wrap; overflow-wrap: anywhere; margin-bottom: 0; }
    textarea { box-sizing: border-box; width: 100%; font: inherit; padding: 12px; border: 1px solid #a8b4c4; border-radius: 6px; }
    button { font: inherit; padding: 10px 18px; cursor: pointer; margin-top: 10px; }
    button:disabled { cursor: default; opacity: .6; }
    #status { min-height: 24px; }
    summary { cursor: pointer; }
  </style>
</head>
<body>
  <h1>Customer support agent</h1>
  <p>Ask about customers and orders. Enter <code>exit</code> to end the conversation.</p>
  <details><summary>Available tools</summary><ul id="tools"></ul></details>
  <section id="messages" role="log" aria-label="Conversation" aria-live="polite"></section>
  <form id="chat">
    <label for="prompt">Your request</label>
    <textarea id="prompt" rows="3" required disabled></textarea>
    <button id="send" disabled>Send</button>
    <button id="reset" type="button" disabled>New conversation</button>
  </form>
  <p id="status" role="status" aria-live="polite">Connecting…</p>
  <script>
    const messages = document.querySelector('#messages');
    const prompt = document.querySelector('#prompt');
    const send = document.querySelector('#send');
    const reset = document.querySelector('#reset');
    const status = document.querySelector('#status');
    let ended = false;

    function setBusy(busy) {
      prompt.disabled = busy || ended;
      send.disabled = busy || ended;
      reset.disabled = busy;
    }

    function addMessage(role, text) {
      const article = document.createElement('article');
      article.className = 'message ' + role;
      const label = document.createElement('strong');
      label.textContent = role === 'user' ? 'You' : 'Gemini';
      const content = document.createElement('p');
      content.textContent = text;
      article.append(label, content);
      messages.append(article);
      return article;
    }

    async function request(url, options) {
      const response = await fetch(url, options);
      if (response.status === 204) return;
      const data = await response.json();
      if (!response.ok) throw new Error(data.error || data.detail || 'Request failed.');
      return data;
    }

    document.querySelector('#chat').addEventListener('submit', async event => {
      event.preventDefault();
      const text = prompt.value;
      if (!text.trim()) return;
      setBusy(true);
      status.textContent = 'Thinking…';
      const pendingMessage = addMessage('user', text);
      try {
        const data = await request('/api/chat', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ prompt: text })
        });
        ended = data.ended;
        if (!ended) addMessage('assistant', data.text);
        prompt.value = '';
        status.textContent = ended ? 'Conversation ended. Start a new conversation to continue.' : '';
      } catch (error) {
        pendingMessage.remove();
        status.textContent = error.message;
      } finally {
        setBusy(false);
        if (!ended) prompt.focus();
      }
    });

    reset.addEventListener('click', async () => {
      setBusy(true);
      try {
        await request('/api/chat/reset', { method: 'POST' });
        messages.replaceChildren();
        ended = false;
        prompt.value = '';
        status.textContent = '';
      } catch (error) {
        status.textContent = error.message;
      } finally {
        setBusy(false);
        if (!ended) prompt.focus();
      }
    });

    async function load() {
      try {
        const data = await request('/api/chat');
        for (const tool of data.tools) {
          const item = document.createElement('li');
          item.textContent = `${tool.name}: ${tool.description}`;
          document.querySelector('#tools').append(item);
        }
        for (const message of data.messages) addMessage(message.role, message.text);
        ended = data.ended;
        status.textContent = ended ? 'Conversation ended. Start a new conversation to continue.' : '';
        setBusy(false);
      } catch (error) {
        status.textContent = error.message + ' Reload the page to retry.';
      }
    }
    load();
  </script>
</body>
</html>
